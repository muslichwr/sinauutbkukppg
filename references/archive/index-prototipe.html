<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Latihan UTBK UKPPPG 2026 • PPLG/RPL</title>
<style>
:root{--bg:#f5f7fb;--ink:#1b263b;--muted:#637086;--panel:#fff;--line:#dee5ee;--navy:#194b72;--teal:#087f75;--teall:#e7f7f4;--accent:#f8c56d;--danger:#b33e42;--dangerl:#fff0f0;--green:#1c7955;--greenl:#edfaf2;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e4aa4b;outline-offset:2px}a{color:var(--navy)}.shell{max-width:1160px;margin:0 auto;padding:22px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:4px 0 20px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font-weight:800;color:var(--navy)}.logo{display:grid;place-items:center;background:var(--navy);color:#fff;width:40px;height:40px;border-radius:12px;font-size:21px}.small{font-size:13px}.muted{color:var(--muted)}.pill{padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;background:#fff}.hero{padding:33px 0 13px}.hero h1{font-size:clamp(27px,4vw,44px);line-height:1.13;letter-spacing:-.03em;max-width:780px;margin:8px 0 14px}.hero p{max-width:840px;font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.chip{background:#e6edf7;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700;color:#335675}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 4px 21px #25415a0a}.mode h3{margin:4px 0 9px;font-size:20px}.mode p{font-size:14px;color:var(--muted);min-height:62px}.mode .num{font-size:24px;color:var(--navy);font-weight:800}.btn{padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:750;min-height:43px}.btn:hover{border-color:var(--navy)}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn.teal{background:var(--teal);color:white;border-color:var(--teal)}.btn.danger{border-color:#f1bfc0;color:var(--danger)}.btn:disabled{cursor:not-allowed;opacity:.55}.btn.wide{width:100%}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}.controls label{font-size:14px}.controls select{background:white;padding:10px;border-radius:10px;border:1px solid var(--line);max-width:340px}.hint{padding:14px 18px;background:#fff8e8;border:1px solid #f6dcab;border-radius:12px;color:#684b16;margin-top:22px;font-size:13px}.examhead{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:23px 0 16px}.progtrack{height:9px;background:#e5ebf1;border-radius:20px;overflow:hidden}.prog{height:100%;background:var(--teal);transition:width .2s}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:17px;align-items:start}.question{padding:26px}.qinfo{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.qtitle{font-size:clamp(18px,2.2vw,23px);letter-spacing:-.01em;line-height:1.52;margin:18px 0}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);padding:13px;border-radius:12px;cursor:pointer;min-height:55px;background:white}.choice:hover{border-color:#9ab0cb;background:#fbfdff}.choice:has(input:checked){background:var(--teall);border-color:var(--teal)}.choice input{flex:none;width:18px;height:18px;accent-color:var(--teal);margin:3px 0 0}.letter{display:inline-grid;place-items:center;flex:none;width:25px;height:25px;border-radius:7px;background:#edf1f7;font-weight:800;color:var(--navy)}.choice p{margin:0;white-space:pre-wrap}.statements{display:grid;gap:13px}.stmt{border:1px solid var(--line);border-radius:12px;padding:15px}.stmt p{margin:0 0 11px}.radioopts{display:flex;gap:8px;flex-wrap:wrap}.radioopts label{display:flex;align-items:center;gap:6px;background:#f6f8fa;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}.radioopts label:has(input:checked){background:var(--teall);border-color:var(--teal)}input[type=radio],input[type=checkbox]{accent-color:var(--teal)}.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;border-top:1px solid var(--line);padding-top:18px}.bar .left,.bar .right{display:flex;gap:8px;flex-wrap:wrap}.review{margin-top:17px;padding:18px;border-radius:12px;border:1px solid #b7d8c7;background:var(--greenl)}.review.bad{background:var(--dangerl);border-color:#edcbcb}.review strong{display:block;margin-bottom:8px}.review p{margin:5px 0}.navtitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.numbers button{height:38px;background:white;border:1px solid var(--line);border-radius:8px;font-weight:700}.numbers button.answered{background:var(--teall);border-color:var(--teal)}.numbers button.current{background:var(--navy);color:white;border-color:var(--navy)}.numbers button.flagged{box-shadow:inset 0 -4px 0 #f4ae35}.numbers button.wrong{background:#fde7e7;border-color:#d57c7c}.numbers button.good{background:#e2f7e9;border-color:#6caa7b}.score{font-size:44px;font-weight:850;letter-spacing:-.035em;color:var(--navy)}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#f5f9fd;border:1px solid var(--line);border-radius:12px;padding:13px}.stat strong{font-size:24px}.tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}.tb td,.tb th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.tb th:last-child,.tb td:last-child{text-align:right}.resource{font-size:13px;padding:20px 0;color:var(--muted)}.resource a{overflow-wrap:anywhere}.endsection{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.empty{padding:30px;text-align:center}.sticky{position:sticky;top:14px}.darkfooter{font-size:12px;margin:25px 0;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.sticky{position:static}.panel{padding:16px}.question{padding:18px}.mode p{min-height:0}.numbers{grid-template-columns:repeat(10,1fr)}.result-grid{grid-template-columns:1fr 1fr}.shell{padding:15px 12px 48px}}
@media(max-width:470px){.numbers{grid-template-columns:repeat(8,1fr)}.bar{align-items:stretch}.bar .left,.bar .right{width:100%}.bar .btn{flex:1}.result-grid{grid-template-columns:1fr}.brand span:last-child{font-size:14px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="logo">U</span><span>UKPPPG 2026 <span class="muted">/ Latihan PPLG–RPL</span></span></div><button class="btn small" onclick="goHome()">Beranda</button></header><main id="app"></main><footer class="darkfooter">Disusun sebagai latihan mandiri orisinal. Bukan soal resmi, bocoran, atau simulasi resmi BPPP. Acuan: Juknis UKPPPG Calon Guru 2026 halaman 7 dan Lampiran 4 halaman 47.</footer></div>
<script>
'use strict';
const BANK=[{"id":1,"code":"P.1","type":"PG","stem":"Dalam rancangan ERD perpustakaan kelas, beberapa murid menjadikan nama siswa sebagai primary key karena setiap murid punya nama. Guru menemukan dua murid bernama Nisa. Tindakan pembelajaran yang paling tepat adalah ...","options":["Memberi definisi primary key untuk dicatat lalu meminta murid lanjut menggambar.","Memperlihatkan dua rekaman bernama Nisa, mengajak murid menguji identitas unik, lalu merevisi rancangan dengan ID siswa.","Langsung mengganti semua nama menjadi nomor urut tanpa diskusi.","Menghapus salah satu rekaman Nisa agar tidak ada duplikasi."],"key":"B","why":"Pertentangan data nyata mengungkap miskonsepsi: nama tidak menjamin keunikan, sedangkan ID siswa dapat menjadi PK. Guru membantu murid menemukan alasan sebelum memperbaiki ERD.","section":"PCK"},{"id":2,"code":"P.1","type":"MCMA","stem":"Kelompok merancang basis data peminjaman alat lab. Guru ingin menghubungkan konsep relasi satu-ke-banyak dengan implementasi SQL. Aktivitas mana yang paling mendukung? Pilih semua jawaban yang tepat.","options":["Meminta murid menyalin definisi foreign key berulang kali.","Membuat contoh satu siswa yang memiliki beberapa peminjaman.","Mengabaikan tabel referensi agar latihan lebih singkat.","Menempatkan id_siswa pada tabel peminjaman dan menguji data yang terhubung.","Meminta murid menjelaskan dampak jika id_siswa pada peminjaman tidak merujuk siswa yang ada."],"key":["B","D","E"],"why":"B, D, E menghubungkan kardinalitas, implementasi FK, dan integritas referensial. Menyalin definisi atau menghilangkan referensi tidak memfasilitasi pemahaman.","section":"PCK"},{"id":3,"code":"P.1","type":"PG","stem":"Murid membuat formulir Laravel yang bisa dikirim walaupun kolom email kosong. Mereka menyimpulkan atribut required di HTML saja pasti cukup menjaga validitas data. Cara paling tepat meluruskan konsep adalah ...","options":["Menyuruh murid menghafal semua aturan validasi Laravel.","Mengganti framework agar validasi otomatis sempurna.","Mendemonstrasikan pengiriman request yang melewati validasi browser, lalu membimbing penerapan validasi sisi server.","Menganggap hasilnya benar selama tampilan formulir rapi."],"key":"C","why":"Validasi browser membantu pengalaman pengguna, tetapi pemeriksaan data tetap diperlukan di server. Demonstrasi request memperlihatkan alasan teknisnya.","section":"PCK"},{"id":4,"code":"P.1","type":"Kategori","stem":"Guru memakai dua tabel kecil, siswa dan peminjaman, untuk membangun pemahaman JOIN. Nilai tiap tindakan sebagai Tepat atau Tidak tepat.","options":["Murid memprediksi hasil JOIN sebelum menjalankan query, lalu membandingkan prediksi dengan keluaran.","Guru langsung memberikan query jadi tanpa membahas relasi tabel.","Murid menjelaskan mengapa baris tertentu muncul atau tidak muncul dalam hasil INNER JOIN."],"key":["T","F","T"],"why":"Prediksi, uji, dan penjelasan hasil membangun model mental. Query yang hanya disalin dapat menghasilkan keluaran tanpa pemahaman relasi.","section":"PCK"},{"id":5,"code":"P.1","type":"PG","stem":"Saat mengenalkan objek dalam pemrograman berorientasi objek, murid menyamakan class dan object. Representasi awal mana yang paling membantu?","options":["Membandingkan class dengan rancangan atribut/perilaku dan object dengan dua instans nyata berbeda.","Meminta murid langsung membuat aplikasi kompleks tanpa contoh.","Mengatakan class dan object identik agar mudah diingat.","Menunda pembahasan hingga ujian akhir."],"key":"A","why":"Contoh dua objek dari satu class membedakan cetak biru dan instans sambil mempertahankan keterkaitan konsep dengan kode.","section":"PCK"},{"id":6,"code":"P.1","type":"MCMA","stem":"Kelompok belajar kolaborasi Git pada proyek website kelas. Bukti pemahaman alur kerja yang layak diminta guru adalah ... Pilih semua yang tepat.","options":["Mengumpulkan satu file ZIP terakhir tanpa riwayat perubahan.","Memperlihatkan commit dengan pesan yang menjelaskan perubahan.","Menjelaskan kapan sebuah branch perlu digabung dan bagaimana menangani konflik.","Memastikan semua murid memakai satu akun agar mudah.","Menjelaskan perubahan lewat perbandingan diff pada dua versi kode."],"key":["B","C","E"],"why":"Commit, branch/merge, dan diff merupakan bukti proses version control; satu file ZIP atau satu akun bersama menghilangkan jejak kontribusi.","section":"PCK"},{"id":7,"code":"P.1","type":"PG","stem":"Pada kasus transaksi koperasi sekolah, setiap transaksi bisa berisi banyak jenis barang. Murid membuat satu kolom barang1, barang2, barang3 pada tabel transaksi. Pertanyaan pemantik terbaik adalah ...","options":["“Kenapa kalian tidak memilih nama kolom lebih pendek?”","“Siapa yang paling cepat bisa menghafal SQL?”","“Bagaimana jika satu transaksi memuat enam barang dan jumlah tiap barang berbeda?” lalu mengarahkan ke tabel detail_transaksi.","“Maukah kalian menghapus transaksi yang berisi banyak barang?”"],"key":"C","why":"Kasus enam barang menonjolkan keterbatasan kolom berulang dan kebutuhan tabel detail yang terhubung dengan transaksi serta barang.","section":"PCK"},{"id":8,"code":"P.1","type":"Kategori","stem":"Guru mengajar perulangan dengan tabel pelacakan nilai variabel. Nilai tindakan sebagai Tepat atau Tidak tepat.","options":["Mengajak murid menelusuri nilai variabel pada setiap iterasi sebelum menjalankan program.","Menilai jawaban benar dari keluaran akhir saja tanpa memeriksa alasan murid.","Membandingkan pelacakan manual dengan keluaran program lalu membahas selisihnya."],"key":["T","F","T"],"why":"Trace table membantu menjelaskan keadaan program, bukan hanya hasil akhir. Membandingkan hasil merupakan kesempatan refleksi.","section":"PCK"},{"id":9,"code":"P.2","type":"PG","stem":"Asesmen awal menunjukkan sebagian murid sudah lancar SELECT-WHERE, sebagian belum mengenal kondisi WHERE. Strategi paling responsif adalah ...","options":["Memberikan tugas identik dengan target waktu sama untuk semuanya.","Membagi dukungan dan tingkat tantangan secara fleksibel sesuai bukti awal, dengan tujuan belajar inti yang sama.","Memindahkan murid yang belum lancar ke luar kelas.","Hanya menunjuk murid paling cepat untuk menjawab."],"key":"B","why":"Diferensiasi menyesuaikan jalan menuju tujuan yang sama berdasarkan kebutuhan nyata; bukan pelabelan kelompok tetap.","section":"PCK"},{"id":10,"code":"P.2","type":"Kategori","stem":"Di laboratorium, empat murid belum mendapat komputer. Nilai keputusan guru sebagai Tepat atau Tidak tepat.","options":["Menyusun giliran operator, penguji, dan pencatat sehingga semua berperan dan berganti peran.","Memberikan penilaian keterampilan komputer hanya kepada murid yang kebagian perangkat.","Menyiapkan tugas prediksi query atau rancangan ERD saat menunggu giliran praktik."],"key":["T","F","T"],"why":"Rotasi dan tugas tanpa perangkat menjaga partisipasi serta kesempatan menunjukkan capaian. Penilaian harus adil terhadap akses.","section":"PCK"},{"id":11,"code":"P.2","type":"MCMA","stem":"Salah satu murid memiliki kendala penglihatan dan kesulitan membaca tangkapan layar kode yang kecil. Penyesuaian apa yang tepat? Pilih semua.","options":["Menyediakan teks kode yang dapat diperbesar atau dibaca pembaca layar.","Mengurangi target menjadi hanya menonton teman tanpa kontribusi.","Memastikan kontras dan keterbacaan bahan praktik.","Mengizinkan alternatif cara menjelaskan logika program selama mengukur tujuan yang sama.","Mengecualikan murid dari asesmen agar tidak kesulitan."],"key":["A","C","D"],"why":"Penyesuaian akses dan cara respons dapat menjaga target kompetensi. Menghapus kesempatan praktik atau asesmen bukan pilihan inklusif.","section":"PCK"},{"id":12,"code":"P.2","type":"PG","stem":"Murid yang cepat selesai CRUD mulai tidak tertantang, sementara teman lain masih membuat tabel. Tindakan terbaik adalah ...","options":["Memberikan tantangan lanjutan validasi dan uji kasus batas, sambil menyediakan bantuan bertahap bagi yang masih kesulitan.","Menjadikan murid cepat selesai sebagai pengganti guru sepanjang jam.","Menghentikan kegiatan semua murid sampai seluruh kelas sama cepat.","Memberi tugas menyalin ulang kode tanpa tujuan baru."],"key":"A","why":"Tantangan pengayaan dan scaffolding disesuaikan kesiapan. Tutor sebaya boleh membantu, tetapi tidak menggantikan tanggung jawab guru.","section":"PCK"},{"id":13,"code":"P.2","type":"PG","stem":"Dalam diskusi ERD ada murid yang sulit mengikuti penjelasan lisan di ruang bising. Respons guru yang paling tepat adalah ...","options":["Menganggap murid tidak fokus dan menegur di depan kelas.","Menambah volume bicara saja tanpa melihat hambatan.","Memberikan instruksi tertulis/visual, memastikan posisi dan akses komunikasi, serta mengecek pemahaman secara pribadi.","Membebaskan murid dari tujuan pembelajaran."],"key":"C","why":"Akses multimodal dan pengecekan pemahaman membuat murid dapat ikut tanpa distigma.","section":"PCK"},{"id":14,"code":"P.3","type":"PG","stem":"Saat latihan debugging banyak murid malu karena error. Guru ingin kelas aman untuk mencoba. Respons terbaik adalah ...","options":["Mengumumkan siapa paling banyak error.","Menunjukkan contoh error dari kode sederhana, menormalisasi revisi, dan meminta murid menjelaskan langkah diagnosis.","Menghapus latihan debugging dari kegiatan.","Menghitung semua error sebagai pelanggaran tata tertib."],"key":"B","why":"Menormalisasi kesalahan sebagai bukti proses belajar dan mengajarkan strategi diagnosis mendukung keberanian bereksperimen.","section":"PCK"},{"id":15,"code":"P.3","type":"Kategori","stem":"Guru menyiapkan proyek pencatatan peminjaman kelas. Nilai praktik berikut sebagai Tepat atau Tidak tepat.","options":["Membuka pembelajaran dengan masalah yang dekat dengan kebutuhan murid dan menjelaskan alasan mempelajarinya.","Mewajibkan setiap kelompok menghias slide tanpa menguji fungsi database.","Mengakhiri proyek dengan refleksi keputusan desain, kendala, dan perbaikan."],"key":["T","F","T"],"why":"Pembelajaran bermakna menghubungkan tujuan, pengalaman, dan refleksi; hiasan bukan bukti capaian teknis.","section":"PCK"},{"id":16,"code":"P.3","type":"MCMA","stem":"Guru ingin suasana diskusi kode menyenangkan tetapi tetap menantang. Pilih praktik yang tepat.","options":["Mengizinkan kelompok menjelaskan alternatif solusi tanpa diejek.","Menyebut kode murid tertentu “paling bodoh” sebagai humor.","Memberi kriteria keberhasilan yang jelas dan kesempatan memperbaiki produk.","Memuji proses pengujian dan argumentasi, bukan hanya jawaban tercepat.","Mewajibkan semua murid meniru satu cara tanpa berdiskusi."],"key":["A","C","D"],"why":"Keamanan psikologis, kesempatan revisi, dan penghargaan atas alasan membangun keterlibatan tanpa menurunkan standar.","section":"PCK"},{"id":17,"code":"P.3","type":"PG","stem":"Menjelang akhir sesi SQL, murid mulai kehilangan fokus. Pilihan yang tetap bermakna adalah ...","options":["Memberi ceramah baru selama 30 menit tanpa interaksi.","Menutup pelajaran lebih awal tanpa asesmen.","Meminta murid menyalin definisi JOIN sebanyak sepuluh kali.","Melakukan tantangan singkat: prediksi query, uji di DB, lalu simpulkan satu temuan dan satu pertanyaan."],"key":"D","why":"Aktivitas singkat yang mengaktifkan prediksi–uji–refleksi memulihkan keterlibatan sekaligus memeriksa pemahaman.","section":"PCK"},{"id":18,"code":"P.4","type":"PG","stem":"Murid menggunakan AI untuk membuat kode autentikasi dan menganggap hasilnya pasti aman. Guru sebaiknya ...","options":["Melarang pembicaraan tentang AI selamanya.","Meminta murid menguji dan menjelaskan kode, memeriksa pengelolaan sandi serta input, dan mendiskusikan keterbatasan keluaran AI.","Memberi nilai penuh karena aplikasi berhasil dijalankan.","Membagikan kredensial server sekolah ke AI untuk meminta perbaikan."],"key":"B","why":"Literasi AI mencakup verifikasi fungsi, keamanan, sumber data, dan tanggung jawab penggunaan.","section":"PCK"},{"id":19,"code":"P.4","type":"Kategori","stem":"Guru memakai platform daring untuk penugasan RPL. Nilai keputusan berikut sebagai Tepat atau Tidak tepat.","options":["Menyiapkan alternatif akses saat jaringan atau perangkat murid terbatas.","Mengunggah data identitas siswa asli ke layanan publik agar contoh terlihat realistis.","Memilih alat berdasarkan kontribusinya terhadap tujuan belajar, bukan popularitasnya."],"key":["T","F","T"],"why":"Penggunaan TIK perlu mempertimbangkan akses, privasi, dan kesesuaian tujuan, bukan semata fitur.","section":"PCK"},{"id":20,"code":"P.4","type":"MCMA","stem":"Saat internet lab tidak stabil, guru tetap ingin murid mempelajari hubungan tabel. Pilih alternatif yang tepat.","options":["Menggunakan kartu entitas dan atribut untuk memodelkan relasi secara luring.","Menunggu internet pulih tanpa aktivitas belajar apa pun.","Menyiapkan skrip SQL lokal atau dataset contoh yang bisa dijalankan tanpa internet.","Menggunakan kertas untuk memprediksi hasil JOIN, lalu menguji saat perangkat siap.","Menghapus tujuan belajar hari itu selamanya."],"key":["A","C","D"],"why":"Model fisik, SQL lokal, dan prediksi kertas tetap menargetkan konsep yang sama meski koneksi tidak tersedia.","section":"PCK"},{"id":21,"code":"P.4","type":"PG","stem":"Guru hendak memilih aplikasi gambar ERD daring. Murid mampu menggambar ERD di kertas. Prinsip pilihan paling tepat adalah ...","options":["Gunakan aplikasi apa pun asalkan paling ramai dipakai.","Teknologi wajib digunakan di setiap tahap meskipun waktu terbuang untuk registrasi.","Pilih alat apabila membantu menguji relasi, merevisi rancangan, atau kolaborasi; kertas tetap sah bila mencapai tujuan.","Hanya hasil digital yang boleh dinilai."],"key":"C","why":"Teknologi alat, bukan tujuan. Pilihan didasarkan pada nilai tambah pedagogis dan kondisi akses.","section":"PCK"},{"id":22,"code":"P.4","type":"PG","stem":"Sebuah generator kode AI menghasilkan query yang menampilkan informasi pribadi siswa tanpa pembatasan. Tugas belajar yang paling tepat adalah ...","options":["Membandingkan keluaran dengan kebutuhan dan prinsip aks const STORAGE='ukin2026-pplg-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letters=['A','B','C','D','E'];
let S={mode:'home',pool:[],idx:0,answers:{},flagged:{},checked:{},done:false,lastWrong:[],sessionName:''};
try{let p=JSON.parse(localStorage.getItem(STORAGE)||'null');if(p && Array.isArray(p.pool) && p.mode && p.pool.every(id=>id>=1&&id<=80))S=p}catch(e){}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){}}
function cur(){return BANK[S.pool[S.idx]-1]}
function response(q){return S.answers[q.id]}
function answered(q){let a=response(q);return q.type==='PG'?Boolean(a):q.type==='MCMA'?Array.isArray(a)&&a.length>0:Array.isArray(a)&&a.length===3&&a.every(x=>x==='T'||x==='F')}
function correct(q){let a=response(q);if(!answered(q))return false;if(q.type==='PG')return a===q.key;if(q.type==='MCMA')return a.length===q.key.length&&a.every(v=>q.key.includes(v));return a.every((x,i)=>x===q.key[i])}
function countAnswered(){return S.pool.reduce((n,id)=>n+(answered(BANK[id-1])?1:0),0)}
function goHome(){S.mode='home';save();render()}
function start(mode,code=''){let pool=BANK.filter(x=>mode==='all'||mode==='pck'&&x.section==='PCK'||mode==='pu'&&x.section==='PU'||mode==='code'&&x.code===code||mode==='wrong'&&S.lastWrong.includes(x.id)).map(x=>x.id);if(!pool.length){alert('Belum ada soal di bagian ini.');return;}if(S.pool.length&&S.mode==='quiz'&&!S.done&&Object.keys(S.answers).length){if(!confirm('Mulai sesi baru? Jawaban sesi berjalan akan diganti.'))return}
S={mode:'quiz',pool,idx:0,answers:{},flagged:{},checked:{},done:false,lastWrong:S.lastWrong||[],sessionName:mode==='all'?'Simulasi 80 soal':mode==='pck'?'Latihan PCK':mode==='pu'?'Latihan Pedagogi Umum':mode==='wrong'?'Ulang soal salah':`Latihan ${code} — ${CODE_NAMES[code]}`};save();render()}
function makeHome(){let hasWrong=S.lastWrong&&S.lastWrong.length;let opts=Object.entries(CODE_NAMES).map(([k,v])=>`<option value="${k}">${k} — ${esc(v)}</option>`).join('');return `<section class="hero"><span class="pill">BELAJAR H-1 • ORISINAL • BISA OFFLINE</span><h1>Latihan UTBK UKPPPG Calon Guru 2026</h1><p class="muted">80 soal bertipe <b>PG, PGK Kategori, dan MCMA</b>. Semua diberi kode subkompetensi dan pembahasan. PCK berfokus pada situasi pengajaran PPLG/RPL, sedangkan Pedagogi Umum melatih pengambilan keputusan guru.</p><div class="chips"><span class="chip">50 PCK</span><span class="chip">30 Pedagogi Umum</span><span class="chip">17 subkompetensi</span><span class="chip">40 PG · 20 Kategori · 20 MCMA</span></div></section><div class="grid"><div class="panel mode"><div class="num">80</div><h3>Simulasi lengkap</h3><p>Latihan seluruh soal dalam satu sesi. Buka pembahasan per soal atau lihat skor akhir.</p><button class="btn primary wide" onclick="start('all')">Mulai 80 soal</button></div><div class="panel mode"><div class="num">50</div><h3>Latihan PCK RPL</h3><p>Kasus ERD, SQL, Laravel, debugging, Git, keamanan data, dan strategi mengajarkannya.</p><button class="btn wide" onclick="start('pck')">Mulai PCK</button></div><div class="panel mode"><div class="num">30</div><h3>Pedagogi Umum</h3><p>Asesmen, diferensiasi, komunikasi, etika, refleksi, dan keputusan pembelajaran.</p><button class="btn wide" onclick="start('pu')">Mulai Pedagogi Umum</button></div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">Fokus subkompetensi tertentu</h3><p class="muted small">Pilih sesuai kelemahanmu setelah melihat hasil latihan.</p><div class="controls"><select id="codeSelect" aria-label="Pilih subkompetensi">${opts}</select><button class="btn teal" onclick="start('code',document.getElementById('codeSelect').value)">Latih bagian ini</button>${hasWrong?`<button class="btn" onclick="start('wrong')">Ulang ${S.lastWrong.length} soal salah terakhir</button>`:''}</div></div><div class="hint"><b>Cara pakai:</b> klik jawaban lalu “Periksa & bahas” untuk belajar, atau jawab seluruhnya dahulu dan klik “Akhiri & lihat hasil” untuk simulasi. Untuk MCMA pilih lebih dari satu. Kategori dinilai dengan Tepat / Tidak tepat untuk tiap pernyataan. Skor latihan di sini adalah hitung benar per butir, <b>bukan rumus nilai resmi UKPPPG</b>. Jawaban disimpan di browser ini bila diizinkan.</div><p class="resource">Acuan: Juknis UKPPPG Calon Guru 2026, halaman 7 dan 47; bahan pembanding eksternal <a href="https://siapin.sainskerta.net/blog/contoh-soal-ukpppg-pck-pedagogi-umum-pembahasan" target="_blank" rel="noopener noreferrer">contoh soal latihan (bukan resmi)</a>.</p>`}
function describe(q){let ans=response(q);if(q.type==='PG')return `Jawabanmu: ${ans||'belum dijawab'} • Kunci: ${q.key}`;if(q.type==='MCMA')return `Jawabanmu: ${ans&&ans.length?ans.join(', '):'belum dijawab'} • Kunci: ${q.key.join(', ')}`;let str=a=>a.map(z=>z==='T'?'Tepat':z==='F'?'Tidak tepat':'—').join(' / ');return `Jawabanmu: ${str(ans||['','',''])} • Kunci: ${str(q.key)}`}
function options(q){let a=response(q);if(q.type==='Kategori')return `<div class="statements">${q.options.map((v,i)=>`<div class="stmt"><p><b>${i+1}.</b> ${esc(v)}</p><div class="radioopts"><label><input type="radio" name="s${q.id}_${i}" value="T" ${a&&a[i]==='T'?'checked':''} onchange="updateCat(${i},'T')" ${S.mode==='review'?'disabled':''}> Tepat</label><label><input type="radio" name="s${q.id}_${i}" value="F" ${a&&a[i]==='F'?'checked':''} onchange="updateCat(${i},'F')" ${S.mode==='review'?'disabled':''}> Tidak tepat</label></div></div>`).join('')}</div>`;
return `<div class="choices">${q.options.map((v,i)=>{let k=letters[i];let checked=q.type==='PG'?a===k:Array.isArray(a)&&a.includes(k);return `<label class="choice"><input type="${q.type==='PG'?'radio':'checkbox'}" name="q${q.id}" ${checked?'checked':''} onchange="updateOption('${k}',this.checked)" ${S.mode==='review'?'disabled':''}><span class="letter">${k}</span><p>${esc(v)}</p></label>`}).join('')}</div>`}
function updateOption(k,checked){if(S.mode==='review')return;let q=cur();if(q.type==='PG')S.answers[q.id]=k;else{let a=Array.isArray(response(q))?response(q).slice():[];if(checked&&!a.includes(k))a.push(k);if(!checked)a=a.filter(x=>x!==k);S.answers[q.id]=a.sort()}S.checked[q.id]=false;save();render()}
function updateCat(i,v){if(S.mode==='review')return;let q=cur();let a=Array.isArray(response(q))?response(q).slice():['','',''];a[i]=v;S.answers[q.id]=a;S.checked[q.id]=false;save();render()}
function check(){if(S.mode==='review')return;let q=cur();if(!answered(q)){alert('Lengkapi jawaban sebelum membuka pembahasan.');return}S.checked[q.id]=true;save();render()}
function flag(){let id=cur().id;S.flagged[id]=!S.flagged[id];save();render()}
function go(i){S.idx=Math.max(0,Math.min(i,S.pool.length-1));save();render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){return S.pool.map((id,i)=>{let q=BANK[id-1],cl=[S.idx===i?'current':'',answered(q)?'answered':'',S.flagged[id]?'flagged':'',S.done?(correct(q)?'good':'wrong'):''].join(' ');return `<button class="${cl}" onclick="go(${i})" aria-label="Soal ${i+1}" title="Nomor ${id} | ${q.code}">${i+1}</button>`}).join('')}
function finish(){let n=countAnswered(),u=S.pool.length-n;if(u&&!confirm(`Masih ada ${u} soal belum lengkap. Tetap akhiri dan lihat hasil?`))return;S.done=true;S.lastWrong=S.pool.filter(id=>!correct(BANK[id-1]));save();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderQuiz(){let q=cur(),n=countAnswered(),c=S.pool.length,percent=Math.round(n/c*100);return `<div class="examhead"><div><b>${esc(S.sessionName)}</b><div class="muted small">${n}/${c} soal sudah dijawab · ${percent}%</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">Soal ${S.idx+1} / ${c}</span><span class="pill">${q.section} · ${q.code}</span></div></div><div class="progtrack" role="progressbar" aria-valuenow="${n}" aria-valuemax="${c}"><div class="prog" style="width:${percent}%"></div></div><div class="layout" style="margin-top:16px"><article class="panel question"><div class="qinfo"><span class="pill">${q.type==='PG'?'Pilihan ganda':q.type==='MCMA'?'PGK MCMA': 'PGK Kategori'}</span><span class="muted small">${esc(CODE_NAMES[q.code])}</span></div><h2 class="qtitle">${esc(q.stem)}</h2><p class="muted small">${q.type==='PG'?'Pilih satu jawaban paling tepat.':q.type==='MCMA'?'Pilih SEMUA jawaban yang tepat (lebih dari satu).':'Tentukan Tepat / Tidak tepat pada SETIAP pernyataan.'}</p>${options(q)}${S.checked[q.id]||S.done?`<div class="review ${correct(q)?'':'bad'}"><strong>${correct(q)?'✓ Jawaban tepat':'✕ Belum tepat'}</strong><p class="small">${esc(describe(q))}</p><p>${esc(q.why)}</p></div>`:''}<div class="bar"><div class="left"><button class="btn" onclick="flag()">${S.flagged[q.id]?'★ Hapus tanda ragu':'☆ Tandai ragu'}</button>${S.mode==='review'?'':'<button class="btn teal" onclick="check()">Periksa &amp; bahas</button>'}</div><div class="right"><button class="btn" onclick="go(${S.idx-1})" ${S.idx===0?'disabled':''}>← Sebelumnya</button><button class="btn primary" onclick="go(${S.idx+1})" ${S.idx===S.pool.length-1?'disabled':''}>Berikutnya →</button></div></div></article><aside class="panel sticky"><div class="navtitle"><b>Navigasi</b><span class="muted small">${c} nomor</span></div><div class="numbers">${nav()}</div><div class="small muted" style="margin-top:14px">Hijau muda: terjawab · Garis kuning: ragu</div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0">${S.mode==='review'?'<button class="btn primary wide" onclick="S.mode=\'quiz\';save();render()">Kembali ke hasil</button>':'<button class="btn danger wide" onclick="finish()">Akhiri &amp; lihat hasil</button>'}<div class="muted small" style="margin-top:11px">Boleh dikerjakan bertahap; progres tersimpan pada browser yang sama.</div></aside></div>`}
function renderResult(){let total=S.pool.length,good=S.pool.filter(id=>correct(BANK[id-1])).length,wrong=total-good,pct=Math.round(100*good/total);let groups={};for(let id of S.pool){let q=BANK[id-1],key=q.code;groups[key]??={total:0,good:0};groups[key].total++;groups[key].good+=correct(q)?1:0}let rows=Object.entries(groups).map(([k,v])=>`<tr><td><b>${k}</b> <span class="muted small">${esc(CODE_NAMES[k])}</span></td><td><b>${v.good}/${v.total}</b></td></tr>`).join('');let badIds=S.pool.filter(id=>!correct(BANK[id-1]));let badLinks=badIds.map(id=>`<button class="btn small" onclick="S.mode='review';S.done=true;S.idx=S.pool.indexOf(${id});save();render()">No. ${id} · ${BANK[id-1].code}</button>`).join(' ');return `<section class="hero"><span class="pill">HASIL LATIHAN · BUKAN NILAI UKPPPG</span><h1>Hasil ${esc(S.sessionName)}</h1><p class="muted">Skor dihitung dengan satu poin untuk setiap butir yang seluruh jawabannya tepat. Pada MCMA dan Kategori, jawaban parsial belum diberi poin. Sistem penilaian resmi tidak tercantum dalam sumber.</p></section><div class="panel"><div class="result-grid"><div class="stat"><div class="muted small">Ketepatan latihan</div><div class="score">${pct}%</div></div><div class="stat"><div class="muted small">Butir tepat</div><strong>${good} / ${total}</strong></div><div class="stat"><div class="muted small">Butir perlu dipelajari</div><strong>${wrong}</strong></div></div><h3>Per subkompetensi</h3><table class="tb"><thead><tr><th>Indikator</th><th>Benar</th></tr></thead><tbody>${rows}</tbody></table><h3>Soal yang perlu diulang</h3>${badIds.length?`<p class="muted small">Klik nomor untuk melihat jawaban dan pembahasannya.</p><div class="endsection">${badLinks}</div>`:`<p>Bagus, semua butir latihan dijawab tepat. Coba ulang dengan alasan yang berbeda atau diskusikan pilihan pengecohnya.</p>`}<div class="endsection"><button class="btn teal" onclick="goHome()">Kembali ke beranda</button>${badIds.length?`<button class="btn primary" onclick="start('wrong')">Latih ulang ${badIds.length} soal ini</button>`:''}<button class="btn" onclick="S.mode='review';S.done=true;S.idx=0;save();render()">Tinjau semua jawaban</button></div></div>`}
function render(){let app=document.getElementById('app');if(S.mode==='home')app.innerHTML=makeHome();else if(S.mode==='quiz'&&S.done)app.innerHTML=renderResult();else app.innerHTML=renderQuiz();}
render();
</script></body></html>
